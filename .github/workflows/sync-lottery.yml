name: 同步快乐8开奖记录

on:
  workflow_dispatch:
  schedule:
    # UTC 时间，对应北京时间 21:35、21:40、21:45、21:50
    - cron: '35,40,45,50 13 * * *'
    # 对应北京时间 22:00、22:15、22:30
    - cron: '0,15,30 14 * * *'
    # 对应北京时间 23:15
    - cron: '15 15 * * *'

permissions:
  contents: write

concurrency:
  group: sync-lottery-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取快乐8开奖记录
        id: sync
        run: node scripts/sync-am.js

      - name: 提交并推送更新
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kl8-latest.json data/am-latest.json
          git commit -m "chore(data): sync 快乐8开奖记录"
          git push
